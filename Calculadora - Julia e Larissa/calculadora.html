<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="_css/calculadora.css">
</head>
<body style="background-image: url(_img/Teaser_Hexatombe_-_Culto.jpg);">
    <div class="conteudo">
        <div class="calculadora">
            <img src="_img/Símbolo_sangue_ordem_paranormal_app_icon-removebg-preview 1.png" id="img">
            <main class="botoes">
                <input type="text" placeholder="0" id="resultado"/>
                <button class="apagaTudo" id="operador">CE</button>
                <button class="botoesPadrao" id="operador" data-valor="%">%</button>
                <button class="botoesPadrao" id="operador" data-valor="+">+</button>
                <button class="botoesPadrao" id="operador" data-valor="-">-</button>
                <button class="botoesPadrao" data-valor="1">1</button>
                <button class="botoesPadrao" data-valor="2">2</button>
                <button class="botoesPadrao" data-valor="3">3</button>
                <button class="botoesPadrao" id="operador" data-valor="*">&times;</button>
                <button class="botoesPadrao" data-valor="4">4</button>
                <button class="botoesPadrao" data-valor="5">5</button>
                <button class="botoesPadrao" data-valor="6">6</button>
                <button class="botoesPadrao" id="operador" data-valor="/">÷</button>
                <button class="botoesPadrao" data-valor="7">7</button>
                <button class="botoesPadrao" data-valor="8">8</button>
                <button class="botoesPadrao" data-valor="9">9</button>
                <button class="apagaUm" id="operador"><img src="_img/botao-de-deletar.png" height="30px"></button>
                <button class="botoesPadrao" data-valor="0">0</button>
                <button class="botoesPadrao" data-valor=".">.</button>
                <button class="botaoResultado">=</button>
                

            </main>
        </div>
    </div>
<script src="_js/script.js" defer></script>
</body>
</html>
