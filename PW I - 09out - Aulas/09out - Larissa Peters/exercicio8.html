<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercicio 8</title>
    <script>
        var pares = 0; 

        alert("Esse algoritmo falara quantos numeros sao pares.")
        for (var i = 1; i <= 10; i++) {
            var numero = parseInt(prompt("Digite o " + i + "º número:")); 

            if (numero % 2 === 0) { 
                pares++;
            }
        }

        document.write("Você digitou "+ pares +" números pares.");
    </script>
</head>

</body>

</html>
