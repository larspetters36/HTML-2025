<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 4</title>
    <script>
        var soma = 0;

        for (var i = 1; i <= 10; i++) {
            var numero = parseFloat(prompt("Digite o " +i  + 1+ "º número:"));
            soma += numero;
        }

        document.write("A soma dos números é: " +soma);
    </script>
</head>
