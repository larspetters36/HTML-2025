<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>JavaScript I</title>
    <script>
        document.write("<strong> 01 - Comando de repetição)</strong>");
        document.write("<hr />");

        for( var x = 0; x <= 10; x++) {
            if( x == 5) {
                break;
            }
            document.write( x + " - ");
        }
        document.write("Fim do codigo");
        document.write("<hr />");

        for(var x = 0; x <= 10; x++) {
            if(x == 5) {
                continue;
            }
            document.write(x + " - ");
        }
        document.write("Fim do codigo");
    </script>
</head>
