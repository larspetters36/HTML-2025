<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 7</title>
    <script>

        num = prompt("Esse algoritmo dira a taboada do numero inserido. Digite um número:");
        numero = parseInt(num);

        if (isNaN(numero)) {
            document.write("Por favor, digite um número válido.");
        }       
        else {
            document.write("Tabuada do " + numero +":");
            document.write(" <br> ")
            for (var i = 1; i <= 10; i++) {
            document.write(numero +" x " + i + " = " + numero * i +"");
            document.write("<br>");
        }
    }
</script>
</head>
<body>
    
</body>
</html>
