<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>JavaScript I</title>
    <script>
        document.write("<strong> 01 - Comando de repetição)</strong>");
        document.write("<hr />");

        var i = 1;
        while( i <= 7) {
            document.write( i + " - ");
            i++;
        }
        document.write("<hr />");

        var i = 10;
        do{
            document.write( i + " - ");
            i++;
        }
        while(i <= 20);
    </script>
</head>

<body>

</body>

</html>
